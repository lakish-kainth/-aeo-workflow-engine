<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AEO Workflow Engine</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#14181f;--mu:#667085;--bd:#e4e7ec;--ac:#2557d6;--ok:#12805c;--wn:#b54708;--bad:#b42318;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1218;--card:#171b23;--tx:#eef0f4;--mu:#98a2b3;--bd:#2a303c;--ac:#6d93f5;--ok:#47c59b;--wn:#f0a05a;--bad:#f27d72}}
:root[data-theme="dark"]{--bg:#0f1218;--card:#171b23;--tx:#eef0f4;--mu:#98a2b3;--bd:#2a303c;--ac:#6d93f5;--ok:#47c59b;--wn:#f0a05a;--bad:#f27d72}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
h1,h2,h3{margin:0;line-height:1.25}h2{font-size:20px}h3{font-size:14px}p{margin:0}
.wrap{max-width:1080px;margin:0 auto;padding:16px}
.bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.bar b{margin-right:8px}.tab{border:0;background:none;color:var(--mu);padding:6px 10px;border-radius:6px;cursor:pointer;font:inherit}
.tab.on{background:var(--ac);color:#fff}.badge{margin-left:auto;font-size:12px;background:#fef0c7;color:#7a4a00;padding:3px 8px;border-radius:99px}
.grid{display:grid;gap:12px}.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:16px}
.k{font-size:28px;font-weight:650}.mu{color:var(--mu);font-size:12px}.up{color:var(--ok);font-size:12px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--bd);white-space:nowrap}th{color:var(--mu);font-weight:500}
.pill{padding:2px 8px;border-radius:99px;font-size:12px;border:1px solid var(--bd)}.High,.Yes{color:var(--ok)}.Medium{color:var(--wn)}.Low,.No{color:var(--bad)}
button.b{background:var(--ac);color:#fff;border:0;border-radius:6px;padding:8px 12px;cursor:pointer;font:inherit}button.s{background:none;color:var(--ac);border:1px solid var(--bd)}
input,select,textarea{width:100%;padding:8px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx);font:inherit}
label{display:block;font-size:12px;color:var(--mu);margin:8px 0 3px}.row{display:flex;gap:8px;align-items:center;margin:6px 0}.row>.n{width:150px;font-size:13px}.trk{flex:1;background:var(--bg);border-radius:4px;height:10px}.fil{height:10px;border-radius:4px;background:var(--ac)}
pre{background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:12px;overflow:auto;font-size:12px}
.hero{text-align:center;padding:48px 0 24px}.hero h1{font-size:34px}.hero p{color:var(--mu);max-width:620px;margin:12px auto 20px}
.flow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:24px 0}.flow span{background:var(--card);border:1px solid var(--bd);padding:8px 16px;border-radius:99px}
ul{margin:6px 0;padding-left:18px}
</style></head><body>
<div class="bar" id="nav" role="navigation"></div>
<main class="wrap" id="app"></main>
<script>
const BRAND="MSB Docs",COMPS=["DocuSign","Adobe Acrobat Sign","Zoho Sign","Leegality","SignDesk"],ENG=["ChatGPT","Perplexity","Google AI Overviews","Gemini"];
const VIEWS=["Home","Dashboard","Monitoring","Citations","Competitors","Gaps","Scoring","Brief","Schema","Reporting","Settings"];
const trend=[52,54,53,58,61,60,64,67,66,70,74,78];
const vis=[[BRAND,68,34.7,3.1,12],["DocuSign",91,38.2,1.4,15],["Adobe Acrobat Sign",84,31.0,1.8,14],["Zoho Sign",72,22.5,2.6,13],["Leegality",58,16.9,3.0,9],["SignDesk",41,9.3,3.8,7]];
const domains=[["g2.com",31,13.4,"Review platform","High-DA","Medium"],["capterra.com",26,11.3,"Review platform","High-DA","Medium"],["docusign.com",24,10.4,"Vendor website","High-DA","Low"],["economictimes.com",19,8.2,"News","High-DA","High"],["zoho.com",17,7.4,"Vendor website","High-DA","Low"],["meity.gov.in",11,4.8,"Government","High-DA","High"],["reddit.com",9,3.9,"Community/forum","Mid-DA","High"],["industrypublication.example",26,11.3,"Industry publication","Mid-DA","High"]];
let prompts=[
{p:"Best electronic signature software in India",c:"Commercial",m:"India",i:"Legal tech",e:"ChatGPT",f:"Weekly",hit:1,ctx:"Recommended among leading providers",comps:["DocuSign","Adobe Acrobat Sign","Zoho Sign","Leegality"],cites:["g2.com","capterra.com","economictimes.com","docusign.com"],sent:"Positive",ts:"2026-10-05 09:12"},
{p:"Best eSignature software for pharmaceutical companies",c:"Industry",m:"India",i:"Pharma",e:"Perplexity",f:"Weekly",hit:0,ctx:"Not mentioned; competitors cited for 21 CFR Part 11",comps:["DocuSign","Adobe Acrobat Sign"],cites:["docusign.com","g2.com","industrypublication.example"],sent:"Neutral",ts:"2026-10-05 09:14"},
{p:"How do regulated companies manage digital document workflows?",c:"Informational",m:"Global",i:"Life sciences",e:"Google AI Overviews",f:"Monthly",hit:0,ctx:"No brand mention; generic guidance",comps:["Adobe Acrobat Sign"],cites:["meity.gov.in","adobe.com"],sent:"Neutral",ts:"2026-10-04 18:40"},
{p:"Best document workflow automation platforms",c:"Commercial",m:"India",i:"Enterprise",e:"Gemini",f:"Weekly",hit:1,ctx:"Listed as an alternative",comps:["Zoho Sign","SignDesk","DocuSign"],cites:["capterra.com","zoho.com"],sent:"Positive",ts:"2026-10-04 11:03"}];
const gaps=[["Best eSignature software for pharma compliance","High","Low","High","Create an authoritative comparison/use-case page covering 21 CFR Part 11, audit trails, electronic signatures, CSV validation and pharmaceutical workflows."],
["Aadhaar eSign vs DSC: which should you use?","High","Low","Medium","Publish an explainer with a comparison table and FAQ schema; link to IT Act 2000 coverage."],
["Is an electronic signature legally valid in India?","High","Medium","High","Add a direct definition in the first 100 words and cite government sources."],
["Leegality alternatives","Medium","Low","Medium","Build an honest alternatives page with feature and pricing criteria."],
["eSignature audit trail requirements","Medium","Low","Low","Expand existing page with an FAQ block and Article schema."]];
let st={v:"Home",gi:0,brief:null,score:null,json:null};
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
function nav(){$("#nav").innerHTML="<b>AEO Workflow Engine</b>"+VIEWS.map(v=>`<button class="tab ${st.v==v?"on":""}" onclick="go('${v}')">${v}</button>`).join("")+`<span class="badge">Prototype Demo Mode</span>`}
function go(v){st.v=v;nav();render();scrollTo(0,0)}
const kpi=(t,v,d)=>`<div class="card"><div class="mu">${t}</div><div class="k">${v}</div><div class="up">${d}</div></div>`;
const bars=(rows,max)=>rows.map(r=>`<div class="row"><div class="n">${esc(r[0])}</div><div class="trk"><div class="fil" style="width:${r[1]/max*100}%"></div></div><div class="mu" style="width:44px;text-align:right">${r[1]}</div></div>`).join("");
function line(d,w=560,h=170){const mx=100,mn=40,pts=d.map((y,i)=>[20+i*(w-40)/(d.length-1),h-20-(y-mn)/(mx-mn)*(h-40)]);
return `<svg viewBox="0 0 ${w} ${h}" style="width:100%" role="img" aria-label="Visibility trend over 12 weeks"><polyline fill="none" stroke="var(--ac)" stroke-width="2.5" points="${pts.map(p=>p.join(",")).join(" ")}"/>${pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="var(--ac)"/>`).join("")}<text x="20" y="${h-4}" font-size="10" fill="var(--mu)">Wk 1</text><text x="${w-50}" y="${h-4}" font-size="10" fill="var(--mu)">Wk 12</text></svg>`}
const tbl=(h,r)=>`<div class="tw"><table><tr>${h.map(x=>`<th>${x}</th>`).join("")}</tr>${r.map(x=>`<tr>${x.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</table></div>`;
const V={
Home:()=>`<div class="hero"><h1>See How AI Search Sees Your Brand</h1><p>Monitor AI visibility, analyze citations, uncover content gaps, and turn AI search insights into actionable optimization workflows.</p><button class="b" onclick="go('Dashboard')">Explore Demo</button> <button class="b s" onclick="document.getElementById('wf').scrollIntoView()">View Workflow</button></div>
<div class="grid g4">${[["Monitor AI Visibility","Track how your brand appears across AI answer engines."],["Understand Citations","Discover which sources influence AI-generated answers."],["Find Content Gaps","Identify topics where competitors are visible and your brand is missing."],["Optimize Content","Score content against AEO readiness criteria."],["Measure Progress","Track AI citation share of voice over time."]].map(x=>`<div class="card"><h3>${x[0]}</h3><p class="mu">${x[1]}</p></div>`).join("")}</div>
<div class="flow" id="wf"><span>Monitor</span>→<span>Analyze</span>→<span>Optimize</span>→<span>Measure</span></div>
<p class="mu" style="text-align:center">All AI-engine results are simulated Prototype Data. The scoring, brief, schema and CSV tools run locally in your browser.</p>`,
Dashboard:()=>`<h2>Dashboard</h2><p class="mu">Prototype Data for ${BRAND}, last 12 weeks.</p><div class="grid g4" style="margin:12px 0">${kpi("AI Visibility Score","78/100","+12.4% vs previous period")}${kpi("Citation Share of Voice","34.7%","+6.2%")}${kpi("Brand Mention Rate","68%","+9.8%")}${kpi("Content Gaps","27","8 high priority")}</div>
<div class="grid g2"><div class="card"><h3>Visibility trend</h3>${line(trend)}</div><div class="card"><h3>Brand vs competitor visibility</h3>${bars(vis.map(r=>[r[0],r[1]]),100)}</div>
<div class="card"><h3>Top cited domains</h3>${bars(domains.slice(0,5).map(d=>[d[0],d[1]]),35)}</div><div class="card"><h3>AI engine performance (mention rate)</h3>${bars([["ChatGPT",74],["Perplexity",69],["Google AI Overviews",58],["Gemini",71]],100)}</div>
<div class="card"><h3>Recent monitoring results</h3>${tbl(["Prompt","Engine","Mentioned"],prompts.slice(0,3).map(p=>[esc(p.p.slice(0,38))+"…",p.e,`<span class="${p.hit?"Yes":"No"}">${p.hit?"Yes":"No"}</span>`]))}</div>
<div class="card"><h3>Recommended actions</h3><ul><li>Build pharma compliance comparison page</li><li>Add FAQPage schema to eSign guides</li><li>Earn coverage on economictimes.com</li><li>Add definitions to top-of-page copy</li></ul></div></div>`,
Monitoring:()=>`<h2>AI Search Monitoring</h2><p class="mu">Results below are simulated. The data layer is isolated so real engine integrations can replace it later.</p>
<div class="card" style="margin:12px 0"><h3>New prompt</h3><div class="grid g4"><div><label for="np">Prompt</label><input id="np" placeholder="Best eSignature for banks"></div><div><label for="nc">Category</label><select id="nc"><option>Commercial</option><option>Informational</option><option>Industry</option></select></div><div><label for="ne">AI engine</label><select id="ne">${ENG.map(e=>`<option>${e}</option>`).join("")}</select></div><div><label for="nf">Frequency</label><select id="nf"><option>Daily</option><option selected>Weekly</option><option>Monthly</option></select></div></div><div class="row"><button class="b" onclick="addP()">Add and run simulated check</button></div></div>
<div class="card">${prompts.length?tbl(["Prompt","Engine","Brand","Context","Competitors","Citations","Domains","Sentiment","Time"],prompts.map(p=>[esc(p.p),p.e,`<span class="${p.hit?"Yes":"No"}">${p.hit?"Yes":"No"}</span>`,esc(p.ctx),p.comps.join(", ")||"None",p.cites.length,p.cites.join(", "),p.sent,p.ts])):'<p class="mu">No prompts yet.</p>'}</div>`,
Citations:()=>`<h2>Citation Intelligence</h2><p class="mu">Prototype Data</p><div class="card" style="margin-top:12px">${tbl(["Domain","Citations","Share","Category","Authority","Opportunity"],domains.map(d=>[d[0],d[1],d[2]+"%",d[3],d[4],`<span class="${d[5]}">${d[5]}</span>`]))}</div>`,
Competitors:()=>`<h2>Competitor Intelligence</h2><p class="mu">Prototype Data across 15 tracked prompts</p><div class="grid g2" style="margin:12px 0"><div class="card"><h3>Visibility</h3>${bars(vis.map(r=>[r[0],r[1]]),100)}</div><div class="card"><h3>Citation share (%)</h3>${bars(vis.map(r=>[r[0],r[2]]),40)}</div></div><div class="card">${tbl(["Brand","Visibility","Citation share","Avg. position","Prompts appearing"],vis.map(r=>[r[0],r[1],r[2]+"%",r[3],r[4]+"/15"]))}</div>`,
Gaps:()=>`<h2>Content Opportunities</h2><div class="grid" style="margin-top:12px">${gaps.map((g,i)=>`<div class="card"><h3>${g[0]}</h3><p class="mu">Priority <b class="${g[1]}">${g[1]}</b> · Brand visibility <b>${g[2]}</b> · Competitor visibility <b>${g[3]}</b></p><p style="margin:8px 0">${g[4]}</p><button class="b s" onclick="alert('${esc(g[0]).replace(/'/g,"")}\\n\\n'+'Priority: ${g[1]}')">View Opportunity</button> <button class="b" onclick="st.gi=${i};st.brief=null;go('Brief')">Generate Brief</button></div>`).join("")}</div>`,
Scoring:()=>`<h2>AI Content Scoring</h2><p class="mu">Runs locally with simple heuristics; it is an indicator, not a ranking prediction.</p><div class="grid g2" style="margin-top:12px"><div class="card"><label for="tx">Paste content</label><textarea id="tx" rows="14" placeholder="Paste article text here..."></textarea><div class="row"><button class="b" onclick="score()">Score content</button></div></div><div class="card" id="sc">${st.score||'<p class="mu">Paste content and select Score content to see the scorecard.</p>'}</div></div>`,
Brief:()=>{const g=gaps[st.gi];return `<h2>Content Brief Generator</h2><div class="grid g2" style="margin-top:12px"><div class="card"><label for="bt">Topic</label><input id="bt" value="${esc(g[0])}"><label for="ba">Target audience</label><input id="ba" value="Compliance and IT leaders"><label for="bi">Industry</label><input id="bi" value="Pharma"><label for="bk">Primary keyword</label><input id="bk" value="eSignature software India"><label for="bo">Objective</label><select id="bo"><option>Capture commercial-intent demand</option><option>Build topical authority</option></select><div class="row"><button class="b" onclick="brief()">Generate brief</button></div></div><div class="card" id="br">${st.brief||'<p class="mu">Template-based demo output. An LLM provider can be plugged in later.</p>'}</div></div>`},
Schema:()=>`<h2>Schema Recommendations</h2><div class="card" style="margin:12px 0">${tbl(["Type","Why recommended","Required","Missing"],[["Article","Long-form guide","headline, author, datePublished","dateModified"],["FAQPage","Question-led content","mainEntity","acceptedAnswer text"],["SoftwareApplication","Product page","name, offers","aggregateRating"],["Organization","Entity clarity","name, url","sameAs"],["BreadcrumbList","Site hierarchy","itemListElement","—"]])}<div class="row"><button class="b" onclick="jsonld()">Generate JSON-LD</button></div></div><pre id="js">${st.json||"// Click Generate JSON-LD"}</pre>`,
Reporting:()=>`<h2>Reporting</h2><div class="grid g2" style="margin:12px 0"><div class="card"><h3>Weekly visibility</h3>${line(trend)}</div><div class="card"><h3>Citation growth by engine (%)</h3>${bars([["ChatGPT",14],["Perplexity",11],["Google AI Overviews",6],["Gemini",9]],20)}</div></div><div class="card"><button class="b" onclick="csv()">Export CSV</button> <button class="b s" disabled title="Planned for a future release">Export PDF (future feature)</button></div>`,
Settings:()=>`<h2>Settings</h2><div class="card" style="margin-top:12px;max-width:560px"><label for="s1">Brand name</label><input id="s1" value="${BRAND}"><label for="s2">Website</label><input id="s2" placeholder="https://example.com"><label for="s3">Competitors</label><input id="s3" value="${COMPS.join(", ")}"><label for="s4">Industry</label><input id="s4" value="Legal tech"><label for="s5">Target markets</label><input id="s5" value="India, Global"><label for="s6">Primary keywords</label><input id="s6" value="eSignature software India"><label for="s7">Notifications</label><select id="s7"><option>Weekly digest</option><option>Daily</option><option>Off</option></select><p class="mu" style="margin-top:10px">Settings are not persisted in this prototype.</p></div>`};
function render(){$("#app").innerHTML=V[st.v]()}
function addP(){const p=$("#np").value.trim();if(!p){$("#np").focus();return}const hit=Math.random()>.45?1:0;
prompts.unshift({p,c:$("#nc").value,m:"India",i:"—",e:$("#ne").value,f:$("#nf").value,hit,ctx:hit?"Mentioned among options (simulated)":"Not mentioned (simulated)",comps:COMPS.slice(0,2+Math.floor(Math.random()*3)),cites:["g2.com","capterra.com"].slice(0,1+Math.floor(Math.random()*2)),sent:hit?"Positive":"Neutral",ts:new Date().toISOString().slice(0,16).replace("T"," ")});render()}
function score(){const t=$("#tx").value.trim();if(!t){$("#tx").focus();return}const w=t.split(/\s+/).length,sn=t.split(/[.!?]+/).filter(Boolean).length||1,cl=n=>Math.max(0,Math.min(100,Math.round(n)));
const ents=["electronic signature","aadhaar","dsc","it act","21 cfr","audit trail","compliance"].filter(e=>t.toLowerCase().includes(e)).length;
const first=t.split(/\s+/).slice(0,100).join(" ");
const d={"Entity Clarity":cl(30+ents*10),"Answerability":cl(40+(/ is | refers to | means /i.test(first)?30:0)+Math.min(20,w/40)),"Search Intent":cl(45+(/best|how|what|why|vs/i.test(t)?35:0)),"Topical Coverage":cl(20+w/6),"Citation Potential":cl(30+(t.match(/\d+/g)||[]).length*6+(/according|source|study/i.test(t)?15:0)),"Structured Data Readiness":cl(35+(/\n#|\n-|\n\d\./.test("\n"+t)?25:0)+(t.match(/\?/g)||[]).length*5),"Factual Clarity":cl(95-Math.abs(w/sn-18)*3),"Question Coverage":cl(20+(t.match(/\?/g)||[]).length*15)};
const o=Math.round(Object.values(d).reduce((a,b)=>a+b,0)/8),recs=[];
if(d.Answerability<75)recs.push("Add a direct definition in the first 100 words.");if(d["Citation Potential"]<75)recs.push("Add a comparison table or specific figures with sources.");if(d["Question Coverage"]<70)recs.push("Include FAQ coverage for compliance requirements.");if(d["Entity Clarity"]<75)recs.push("Strengthen entity relationships between eSignature, Aadhaar eSign, DSC and IT Act 2000.");if(!recs.length)recs.push("Strong draft. Add FAQPage schema before publishing.");
st.score=`<div class="k">${o}/100</div><p class="mu">Overall AEO readiness (heuristic)</p>${bars(Object.entries(d),100)}<h3 style="margin-top:12px">Recommendations</h3><ul>${recs.map(r=>`<li>${r}</li>`).join("")}</ul>`;$("#sc").innerHTML=st.score}
function brief(){const t=$("#bt").value,k=$("#bk").value,a=$("#ba").value,i=$("#bi").value;
st.brief=`<h3>Suggested H1</h3><p>${esc(t)}: A Guide for ${esc(a)} in ${esc(i)}</p><h3 style="margin-top:10px">Search intent</h3><p>Commercial investigation for "${esc(k)}"</p><h3 style="margin-top:10px">Target questions</h3><ul><li>What does ${esc(i)} compliance require?</li><li>How do providers compare?</li><li>Is it legally valid in India?</li></ul><h3>Outline</h3><ul><li>Definition and context</li><li>Compliance requirements</li><li>Comparison table</li><li>FAQ</li></ul><h3>Entities</h3><p>Electronic signature, Aadhaar eSign, DSC, IT Act 2000, 21 CFR Part 11, audit trail</p><h3 style="margin-top:10px">Citation opportunities</h3><p>economictimes.com, meity.gov.in, industry publications</p><h3 style="margin-top:10px">Schema</h3><p>Article, FAQPage, BreadcrumbList</p>`;$("#br").innerHTML=st.brief}
function jsonld(){st.json=esc(JSON.stringify({"@context":"https://schema.org","@type":"FAQPage",mainEntity:[{"@type":"Question",name:"Is an electronic signature legally valid in India?",acceptedAnswer:{"@type":"Answer",text:"Yes. The IT Act 2000 recognises electronic signatures, including Aadhaar eSign and DSC, subject to conditions."}}]},null,2));$("#js").innerHTML=st.json}
function csv(){const r=[["Week","Visibility Score"],...trend.map((v,i)=>[i+1,v])].map(x=>x.join(",")).join("\n");const a=document.createElement("a");a.href="data:text/csv;charset=utf-8,"+encodeURIComponent(r);a.download="aeo-visibility-demo.csv";a.click()}
nav();render();
</script></body></html>
